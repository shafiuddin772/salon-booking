
  server:
    port: 5000

  spring:
    application:
      name: gateway-server

    cloud:
      gateway:
        server:
          webflux:
            discovery:
              locator:
                enabled: true

            routes:
              - id: USER-SERVICE
                uri: lb://USER-SERVICE
                predicates:
                  - Path=/auth/**,/api/admin/users/**,/api/users/**,/users/**

              - id: BOOKING-SERVICE
                uri: lb://BOOKING-SERVICE
                predicates:
                  - Path=/api/bookings/**

              - id: SALON-SERVICE
                uri: lb://SALON-SERVICE
                predicates:
                  - Path=/api/salons/**,/api/admin/salons/**

              - id: SERVICE-OFFERING
                uri: lb://SERVICE-OFFERING
                predicates:
                  - Path=/api/service-offering/**

              - id: CATEGORY-SERVICE
                uri: lb://CATEGORY-SERVICE
                predicates:
                  - Path=/api/categories/**

  eureka:
    instance:
      hostname: localhost

    client:
      fetch-registry: true
      register-with-eureka: true
      service-url:
        defaultZone: http://localhost:8070/eureka/

